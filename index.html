<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Green Podium</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;600;700&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout: one column — logo header, podium (2-1-3), month progress, Leaf Meter, week-by-week table, owner editor */
:root{
  --bg:#f3f7f2; --surface:#ffffff; --ink:#15301f; --muted:#5b6f60; --line:#d7e3d6;
  --leaf:#294f2c; --leaf-soft:#e1ecdf; --track:#e6eee5;
  --gold:#f9b61c; --silver:#8e9aa3; --bronze:#b06a3b;
  --display:"Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a13; --surface:#16251b; --ink:#e4efe5; --muted:#9fb3a4; --line:#2a3d30;
  --leaf:#5cc27c; --leaf-soft:#1f3a28; --track:#223428;
  --gold:#f9b61c; --silver:#b4c0c8; --bronze:#d48a58; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a13; --surface:#16251b; --ink:#e4efe5; --muted:#9fb3a4; --line:#2a3d30;
  --leaf:#5cc27c; --leaf-soft:#1f3a28; --track:#223428;
  --gold:#f9b61c; --silver:#b4c0c8; --bronze:#d48a58; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:6px}
.logo{align-self:flex-start;background:#fff;border-radius:10px;padding:8px 12px;margin-bottom:10px}
.logo img{display:block;width:180px;height:auto}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--leaf);font-weight:700}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0;text-wrap:balance}
.week{color:var(--muted);margin:0}
.note{background:var(--leaf-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:14px}

/* Month progress */
.weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wk{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wk b{font-family:var(--display);font-size:14px}
.wk span{font-size:12px;color:var(--muted)}
.wk.done{background:var(--leaf);border-color:var(--leaf)}
.wk.done b,.wk.done span{color:#fff}
.wk.final{border-style:dashed;border-color:var(--gold)}

/* Podium */
.stage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:10px}
.spot{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
.medal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;color:#fff;background:var(--muted)}
.r1 .medal{background:var(--gold);color:#294f2c}
.r2 .medal{background:var(--silver)}
.r3 .medal{background:var(--bronze)}
.p1 .medal{width:56px;height:56px;font-size:22px}
.cls{font-family:var(--display);font-weight:700;font-size:clamp(15px,3.6vw,20px);overflow-wrap:anywhere}
.pts{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.block{width:100%;border-radius:10px 10px 0 0;background:var(--leaf-soft);border:1px solid var(--line);border-bottom:none;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:2px}
.block .lvl{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);color:var(--leaf);line-height:1}
.block .tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.p1 .block{height:150px;background:var(--leaf);border-color:var(--leaf)}
.p1 .block .lvl,.p1 .block .tag{color:#fff}
.p2 .block{height:110px}
.p3 .block{height:80px}
.base{height:8px;background:var(--line);border-radius:4px;margin-top:-10px}
.empty .block{opacity:.4}

/* Leaf meter */
section h2{font-family:var(--display);font-size:20px;margin:0 0 4px}
section .hint{color:var(--muted);margin:0 0 14px;font-size:14px}
.meter{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.rank{font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.val{font-variant-numeric:tabular-nums;font-weight:700;color:var(--leaf)}
.val small{font-weight:400;color:var(--muted)}
.bar{grid-column:2 / 4;height:10px;background:var(--track);border-radius:6px;overflow:hidden;display:flex}
.bar span{display:block;height:100%;background:var(--leaf);border-right:2px solid var(--track)}
.bar span:last-child{border-right:none}
.gap{grid-column:2 / 4;font-size:12px;color:var(--muted)}

/* Week table */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
td.pending{color:var(--muted)}
td.tot{font-weight:700;color:var(--leaf)}

/* Actions + editor */
.actions{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;font-weight:600;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--leaf);border-color:var(--leaf);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.status{font-size:13px;color:var(--muted);align-self:center}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.editor label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.editor input{font:inherit;padding:7px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.editor table input{width:58px;text-align:center}
.editor td{padding:4px}
.editor .hint{font-size:13px;color:var(--muted);margin:0}
footer{color:var(--muted);font-size:12px;text-align:center}
.editor h2{font-family:var(--display);font-size:18px;margin:0}
button:disabled{opacity:.6;cursor:wait}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="gp-state">{"title": "Technical Institute", "month": "October 2026", "perWeek": 12, "weekLabels": ["Oct 5–9", "Oct 12–16", "Oct 19–23", "Oct 26–30"], "classes": [{"name": "BT3-IT", "scores": [12, null, null, null]}, {"name": "BT2-IT", "scores": [11, null, null, null]}, {"name": "BT2-ID", "scores": [11, null, null, null]}, {"name": "BT1-IT", "scores": [10, null, null, null]}, {"name": "BT1-ID", "scores": [10, null, null, null]}]}</script>
<script src="app.js"></script>
</body>
</html>
